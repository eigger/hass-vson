name: Validate
'on':
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    uses: eigger/hass-repo-standards/.github/workflows/validate-integration.yml@4fa557eaa7142b87a6cae8b09c249cf50c3865c6
