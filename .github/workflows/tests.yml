name: Tests
'on':
  push:
    branches:
    - master
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  current:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@ca740d88b32fa5dcbc94c41fce2908450c76ed50
    with:
      standards-ref: ca740d88b32fa5dcbc94c41fce2908450c76ed50
      domain: vson
      python-versions: '["3.14"]'
      requirements: requirements_test.txt
      expected-ha-version: '2026.10.2'
      ha-components: bluetooth usb
      test-profile: ha
      pytest-args: tests/components/vson/ -v
  minimum-ha:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@ca740d88b32fa5dcbc94c41fce2908450c76ed50
    with:
      standards-ref: ca740d88b32fa5dcbc94c41fce2908450c76ed50
      domain: vson
      python-versions: '["3.13"]'
      requirements: requirements_test_min.txt
      expected-ha-version: '2025.1.0'
      ha-components: bluetooth usb
      test-profile: ha
      pytest-args: tests/components/vson/ -v
